services:
  test-redis:
    image: redis:7
    volumes: ['test_redis_data:/data']
    labels:
      - 'com.docker.compose.project=test'

  # IMPORTANT: Docker Desktop must be allocated at least 10 GB RAM for tests to pass.
  # With 6 Jest workers (~1 GB each) + Postgres (~512 MB) + Redis, total usage is ~7-8 GB.
  # If workers get SIGKILL (OOM) or random tests timeout, check:
  #   Docker Desktop → Settings → Resources → Memory (should be 12+ GB)
  test-runner:
    networks: [default, shared-postgres]
    volumes:
      - ${TEST_DATABASE_MANIFEST:?Provision test databases first}:/run/bt-test-databases.json:ro
    # setup-e2e-tests.sh always exports TEST_RUNNER_IMAGE: a per-worktree name
    # locally (compose builds it), the CI-prebuilt buildx tag on CI (no build).
    image: ${TEST_RUNNER_IMAGE:-bt-test-runner}
    build:
      context: ../../..
      dockerfile: docker/test/backend/Dockerfile
    depends_on:
      - test-redis
    environment:
      - NODE_ENV=test
      - JEST_WORKERS_AMOUNT=${JEST_WORKERS_AMOUNT:-4}
      - TEST_DATABASE_MANIFEST=/run/bt-test-databases.json
      # so package `config` will look into the correct place
      - NODE_CONFIG_DIR=./packages/backend/config
      # Jest runs CommonJS here, so --experimental-vm-modules must stay out: with it
      # Jest refuses to require mdb-reader ("type": "module") before the transform
      # compiles it down. The suite's other ESM-only packages are mocked.
      # Heap is raised to 4GB to prevent OOM during large test suites.
      - NODE_OPTIONS=--max-old-space-size=4096
      # Pass host CI flag through so setupIntegrationTests.ts enables
      # in-process test retries only on CI (unset locally)
      - CI
    env_file: ../../../.env.test
    labels:
      - 'com.docker.compose.project=test'

volumes:
  test_redis_data:

networks:
  default: {}
  shared-postgres:
    external: true
    name: ${SHARED_POSTGRES_NETWORK:-shared-postgres}
